name: Drawing canvas

on:
  pull_request:
    paths:
      - 'engineering/netbox_drawing_canvas/**'
      - '.github/workflows/drawing-canvas.yml'
  push:
    branches: [engineering]
    paths:
      - 'engineering/netbox_drawing_canvas/**'
      - '.github/workflows/drawing-canvas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: NetBox ${{ matrix.netbox }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        netbox: ['v4.2.9', 'v4.7.4']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: drawing_ci
          POSTGRES_USER: drawing_ci
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['55439:5432']
        options: >-
          --health-cmd "pg_isready -U drawing_ci -d drawing_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ['56389:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      NETBOX_SRC: ${{ github.workspace }}/.drawing-test-netbox
      DRAWING_DEV_DB: drawing_ci
      DRAWING_DEV_DB_USER: drawing_ci
      DRAWING_DEV_DB_PASSWORD: synthetic-ci-only
      NETBOX_REF: ${{ matrix.netbox }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install isolated dependencies
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$NETBOX_REF" https://github.com/netbox-community/netbox.git "$NETBOX_SRC"
          sed 's/psycopg\[c,pool\]/psycopg[binary,pool]/' "$NETBOX_SRC/requirements.txt" > "$RUNNER_TEMP/netbox-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/netbox-requirements.txt" ./engineering/netbox_drawing_canvas ruff playwright
          python -m playwright install --with-deps chromium
          echo "DRAWING_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Backend and source checks
        working-directory: engineering/netbox_drawing_canvas
        run: |
          set -euo pipefail
          ./dev/manage.sh migrate --noinput
          ./dev/manage.sh check
          ./dev/manage.sh test netbox_drawing_canvas.tests --keepdb --noinput
          ./dev/manage.sh makemigrations netbox_drawing_canvas --check --dry-run
          ruff check .
          node --check netbox_drawing_canvas/static/netbox_drawing_canvas/canvas.js
          sh -n dev/manage.sh dev/start-services.sh
      - name: Real browser smoke and HTTP UUID regression
        working-directory: engineering/netbox_drawing_canvas
        env:
          DRAWING_DEV_URL: http://127.0.0.1:8009
        run: |
          set -euo pipefail
          ./dev/manage.sh runserver 127.0.0.1:8009 --noreload > "$RUNNER_TEMP/drawing-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8009/login/ > /dev/null; then break; fi
            sleep 2
          done
          ./dev/manage.sh shell < dev/smoke.py
